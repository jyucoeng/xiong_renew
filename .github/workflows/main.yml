name: renew vps and send message to tg

on:
  workflow_dispatch:  # 允许手动触发 
  schedule:
    - cron: '37 4 */3 * *'  # 每隔 3 天
  push:
    branches:
      - main  # 或其他你希望触发的分支（加上这个玩意就会邮件提醒你脚本执行了）

permissions:
  actions: write   # 允许删除 workflow runs
  contents: write  # 允许提交 time.txt
jobs:
  send_message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'  # 使用合适的 Python 版本

      - name: Install dependencies
        run: |
          pip install requests
          pip install beautifulsoup4
          pip install curl_cffi --upgrade
      - name: Run renew.py
        env:
          ARCTIC_USERNAME: ${{ secrets.ARCTIC_USERNAME }}
          ARCTIC_PASSWORD: ${{ secrets.ARCTIC_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
        run: |
          python renew.py
      
      # ⏱️ 提交 time.txt 到仓库
      - name: Commit time.txt to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f time.txt ]; then
            echo "首次生成时间：$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          else
            echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          fi

          git add time.txt

          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi

      # 🧹 只保留最近 15 次的 workflow 执行记录
      - name: Delete old workflow runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          WORKFLOW_ID="${{ github.workflow }}"

          # 获取第 16 条及之后的记录 ID，跳过最新的 15 条
          gh run list --workflow "$WORKFLOW_ID" --repo "$REPO" --limit 100 --json databaseId \
            --jq '.[15:] | .[].databaseId' \
          | while read run_id; do
              echo "🗑️ 删除旧记录: run_id=$run_id"
              gh run delete "$run_id" --repo "$REPO"
            done
          echo "✅ 清理完成，已保留最近 15 次的执行记录"
